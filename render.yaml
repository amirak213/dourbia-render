# Blueprint Render — test terrain Carthage (orchestrateur + circuits + historique).
# AgentLocation et AgentMeteo exclus volontairement (~100 $/mois au lieu de ~139 $).
# Secrets : sync: false → saisie unique au premier déploiement (valeurs rotatées, jamais dans git).

services:
  - type: web
    name: dourbia-backend
    runtime: docker
    region: frankfurt
    plan: 2c-4g
    numInstances: 1
    branch: main
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    maxShutdownDelaySeconds: 120
    envVars:
      - key: PORT
        value: "10000"
      - key: UVICORN_WORKERS
        value: "1"
      - key: RESERVATION_ENABLED
        value: "0"
      - key: WEB_SEARCH_ENABLED
        value: "false"
      - key: GUARDRAILS_ENABLED
        value: "false"
      - key: RAG_MIN_SCORE
        value: "0.65"
      - key: HF_HUB_OFFLINE
        value: "1"
      - key: TRANSFORMERS_OFFLINE
        value: "1"
      - key: CIRCUIT_DATABASE_URL
        fromDatabase:
          name: dourbia-db
          property: connectionString
      - key: HISTORICAL_DATABASE_URL
        fromDatabase:
          name: dourbia-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: dourbia-redis
          property: connectionString
      - key: GROQ_API_KEY_PRINCIPAL
        sync: false
      - key: GROQ_API_KEY_HISTORIQUE
        sync: false
      - key: GROQ_MODEL
        sync: false
      - key: GROQ_MODEL_FAST
        sync: false
      - key: HISTORICAL_LLM_MODEL
        sync: false
      - key: FRONTEND_ORIGINS
        sync: false
      - key: LANGFUSE_SECRET_KEY
        sync: false
      - key: LANGFUSE_PUBLIC_KEY
        sync: false

  - type: web
    name: dourbia-frontend
    runtime: static
    
    branch: main
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          name: dourbia-backend
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: VITE_OSRM_ENABLED
        value: "true"

  - type: keyvalue
    name: dourbia-redis
    region: frankfurt
    plan: starter
    ipAllowList: []

databases:
  - name: dourbia-db
    region: frankfurt
    plan: 0.5c-1g
    diskSizeGB: 1
    postgresMajorVersion: "16"
    databaseName: dourbia
